<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Çiftliği Pro v3</title>
    <!-- Pi Network SDK -->
    <script src="https://minepi.com"></script>
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #e67e22;
            --dark-bg: #1e272e;
            --card-bg: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: radial-gradient(circle, #34495e, #1a252f);
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .profile-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .user-tag { background: #9b59b6; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-box span { font-size: 22px; font-weight: bold; color: #f1c40f; display: block; margin-top: 5px; }
        
        /* Tarla Grid Yapısı */
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .plot {
            background: #4e3629;
            border-radius: 20px;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 3px solid #3d2a1f;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        .plot:hover { transform: scale(1.02); }
        .plot.growing { background: #5c4033; }
        .plot.ready {
            background: #27ae60;
            border-color: #2ecc71;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .plot-emoji { font-size: 42px; margin-bottom: 5px; }
        .progress-bar-container {
            width: 70%;
            background: rgba(0,0,0,0.4);
            height: 6px;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-bar { width: 0%; height: 100%; background: #3498db; transition: width 1s linear; }

        /* Yeni Tohum Marketi (Altta Bulunan Panel) */
        .market-section {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .market-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #f1c40f; text-align: left; margin-bottom: 10px; font-weight: bold; }
        .market-grid {
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }
        .market-item {
            flex: 1;
            min-width: 100px;
            background: rgba(0,0,0,0.3);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .market-item.selected {
            border-color: #f1c40f;
            background: rgba(241, 196, 15, 0.1);
        }
        .item-emoji { font-size: 24px; display: block; }
        .item-name { font-size: 12px; font-weight: bold; margin: 3px 0; }
        .item-price { font-size: 11px; color: #2ecc71; font-weight: bold; }

        /* Reklam Buton Alanı */
        .ad-banner {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }
        .ad-btn {
            background: #ffffff;
            color: #c0392b;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .ad-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="profile-bar">
        <span style="font-weight: bold; font-size: 18px;">🚜 PiFarm v3</span>
        <div class="user-tag" id="username">Yükleniyor...</div>
    </div>

    <div class="dashboard">
        <div class="stat-box">Cüzdan Puanı <span id="balance">15</span></div>
        <div class="stat-box">Süper Gübre 🧪 <span id="fertilizer-count">1</span></div>
    </div>

    <!-- 4 Adet Tarla -->
    <div class="farm-grid">
        <div class="plot" id="plot-0" onclick="interactPlot(0)">
            <span class="plot-emoji" id="emoji-0">🟫</span>
            <span id="text-0" style="font-size:13px; font-weight:bold;">Boş Toprak</span>
            <div class="progress-bar-container" id="pbc-0" style="display:none;"><div class="progress-bar" id="bar-0"></div></div>
        </div>
        <div class="plot" id="plot-1" onclick="interactPlot(1)">
            <span class="plot-emoji" id="emoji-1">🟫</span>
            <span id="text-1" style="font-size:13px; font-weight:bold;">Boş Toprak</span>
            <div class="progress-bar-container" id="pbc-1" style="display:none;"><div class="progress-bar" id="bar-1"></div></div>
        </div>
        <div class="plot" id="plot-2" onclick="interactPlot(2)">
            <span class="plot-emoji" id="emoji-2">🟫</span>
            <span id="text-2" style="font-size:13px; font-weight:bold;">Boş Toprak</span>
            <div class="progress-bar-container" id="pbc-2" style="display:none;"><div class="progress-bar" id="bar-2"></div></div>
        </div>
        <div class="plot" id="plot-3" onclick="interactPlot(3)">
            <span class="plot-emoji" id="emoji-3">🟫</span>
            <span id="text-3" style="font-size:13px; font-weight:bold;">Boş Toprak</span>
            <div class="progress-bar-container" id="pbc-3" style="display:none;"><div class="progress-bar" id="bar-3"></div></div>
        </div>
    </div>

    <!-- 🛒 Yenilenen Çiftçi Marketi (Altta Sabit) -->
    <div class="market-section">
        <div class="market-title">🛒 Tohum Marketi</div>
        <div class="market-grid">
            <div class="market-item selected" id="item-tomato" onclick="selectSeed('tomato', 3, '🍅')">
                <span class="item-emoji">🍅</span>
                <span class="item-name">Domates</span>
                <span class="item-price">3 🪙</span>
            </div>
            <div class="market-item" id="item-pepper" onclick="selectSeed('pepper', 7, '🫑')">
                <span class="item-emoji">🫑</span>
                <span class="item-name">Biber</span>
                <span class="item-price">7 🪙</span>
            </div>
            <div class="market-item" id="item-berry" onclick="selectSeed('berry', 15, '🍓')">
                <span class="item-emoji">🍓</span>
                <span class="item-name">Altın Çilek</span>
                <span class="item-price">15 🪙</span>
            </div>
        </div>
    </div>

    <div class="ad-banner">
        <div style="font-size:14px; font-weight:bold;">🧪 Laboratuvar Takviyesi</div>
        <div style="font-size:11px; margin-top:2px; opacity:0.9;">Kısa bir video izle, bitkilerini anında hasat edecek Süper Gübre kazan!</div>
        <button class="ad-btn" onclick="watchRewardAd()">📺 Ödüllü Reklam İzle</button>
    </div>
</div>

<script>
    // Pi Platform Güvenli Başlatma
    try {
        Pi.init({ version: "2.0" });
        Pi.authenticate(['username'], (p) => console.log(p))
          .then(auth => document.getElementById('username').innerText = auth.user.username)
          .catch(() => document.getElementById('username').innerText = "Test Modu");
    } catch (e) {
        document.getElementById('username').innerText = "Yerel Mod";
    }

    // Oyun Verileri
    let balance = 15;
    let fertilizer = 1;
    let selectedSeed = 'tomato';
    let seedCost = 3;
    let seedEmoji = '🍅';

    const plantTypes = {
        tomato: { time: 8, sell: 6, emoji: '🍅' },
        pepper: { time: 18, sell: 15, emoji: '🫑' },
        berry: { time: 45, sell: 40, emoji: '🍓' }
    };

    let plots = [
        { status: 'empty', plant: null, maxTime: 0, timeLeft: 0, interval: null },
        { status: 'empty', plant: null, maxTime: 0, timeLeft: 0, interval: null },
        { status: 'empty', plant: null, maxTime: 0, timeLeft: 0, interval: null },
        { status: 'empty', plant: null, maxTime: 0, timeLeft: 0, interval: null }
    ];

    function selectSeed(type, cost, emoji) {
        selectedSeed = type;
        seedCost = cost;
        seedEmoji = emoji;
