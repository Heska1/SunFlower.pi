<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Çiftliği Pro v4</title>
    <!-- Pi Network SDK -->
    <script src="https://minepi.com"></script>
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #e67e22;
            --dark-bg: #1e272e;
            --card-bg: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: radial-gradient(circle, #34495e, #1a252f);
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            padding-bottom: 80px; /* Alttaki market butonu için boşluk */
        }
        .profile-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .user-tag { background: #9b59b6; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-box span { font-size: 22px; font-weight: bold; color: #f1c40f; display: block; margin-top: 5px; }
        
        /* Tarla Grid Yapısı */
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .plot {
            background: #4e3629;
            border-radius: 20px;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 3px solid #3d2a1f;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        .plot:hover { transform: scale(1.02); }
        .plot.growing { background: #5c4033; }
        .plot.ready {
            background: #27ae60;
            border-color: #2ecc71;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .plot-emoji { font-size: 42px; margin-bottom: 5px; }
        .progress-bar-container {
            width: 70%;
            background: rgba(0,0,0,0.4);
            height: 6px;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-bar { width: 0%; height: 100%; background: #3498db; transition: width 1s linear; }

        /* Reklam Buton Alanı */
        .ad-banner {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
            margin-bottom: 20px;
        }
        .ad-btn {
            background: #ffffff;
            color: #c0392b;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* 🛒 Sabit Alt Market Butonu */
        .market-toggle-btn {
            background: #f1c40f;
            color: #1a252f;
            border: none;
            padding: 12px;
            width: 90%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: auto;
        }
        .market-toggle-btn:active { transform: scale(0.95); }

        /* 📦 AÇILIR MARKET SAYFASI (MODAL SCREEN) */
        .market-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .market-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .market-popup {
            background: #2c3e50;
            border: 2px solid #f1c40f;
            width: 85%;
            max-width: 380px;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }
        .market-overlay.open .market-popup {
            transform: scale(1);
        }
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .close-market-btn {
            background: #e74c3c;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }
        .market-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .market-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 16px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }
        .market-row.selected {
            border-color: #f1c40f;
            background: rgba(241, 196, 15, 0.1);
        }
        .row-left { display: flex; align-items: center; gap: 12px; }
        .row-emoji { font-size: 32px; }
        .row-title { font-weight: bold; font-size: 14px; text-align: left; }
        .row-desc { font-size: 11px; color: #bdc3c7; }
        .row-price { background: #2ecc71; color: white; padding: 4px 10px; border-radius: 10px; font-weight: bold; font-size: 13px; }
        
        .selected-indicator {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #f1c40f;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="profile-bar">
        <span style="font-weight: bold; font-size: 18px;">🚜 PiFarm v4</span>
        <div class="user-tag" id="username">Yükleniyor...</div>
    </div>

    <div class="dashboard">
        <div class="stat-box">Cüzdan Puanı <span id="balance">15</span></div>
        <div class="stat-box">Süper Gübre 🧪 <span id="fertilizer-count">1</span></div>
    </div>

    <!-- 4 Adet Tarla -->
    <div class="farm-grid">
        <div class="plot" id="plot-0" onclick="interactPlot(0)">
            <span class="plot-emoji" id="emoji-0">🟫</span>
            <span id="text-0" style="font-size:13px; font-weight:bold;">Boş Toprak</span>
            <div class="progress-bar-container" id="pbc-0" style="display:none;"><div class="progress-bar" id="bar-0"></div></div>
        </div>
        <div class="plot" id="plot-1" onclick="interactPlot(1)">
            <span class="plot-emoji" id="emoji-1">🟫</span>
            <span id="text-1" style="font-size:13px; font-weight:bold;">Boş Toprak</span>
            <div class="progress-bar-container" id="pbc-1" style="display:none;"><div class="progress-bar" id="bar-1"></div></div>
        </div>
        <div class="plot" id="plot-2" onclick="interactPlot(2)">
            <span class="plot-emoji" id="emoji-2">🟫</span>
            <span id="text-2" style="font-size:13px; font-weight:bold;">Boş Toprak</span>
            <div class="progress-bar-container" id="pbc-2" style="display:none;"><div class="progress-bar" id="bar-2"></div></div>
        </div>
        <div class="plot" id="plot-3" onclick="interactPlot(3)">
            <span class="plot-emoji" id="emoji-3">🟫</span>
            <span id="text-3" style="font-size:13px; font-weight:bold;">Boş Toprak</span>
            <div class="progress-bar-container" id="pbc-3" style="display:none;"><div class="progress-bar" id="bar-3"></div></div>
        </div>
    </div>

    <div class="ad-banner">
        <div style="font-size:14px; font-weight:bold;">🧪 Laboratuvar Takviyesi</div>
        <button class="ad-btn" onclick="watchRewardAd()">📺 Ödüllü Reklam İzle</button>
    </div>

    <!-- 🛒 Sabit Alt Market Butonu -->
    <button class="market-toggle-btn" onclick="toggleMarket(true)">🛒 Tohum Marketini Aç</button>
</div>

<!-- 📦 AÇILIR SAYFA APARATI (MODAL POPUP) -->
<div class="market-overlay" id="marketOverlay">
