<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pi Farm - Premium Edition</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-glow: rgba(241, 196, 15, 0.3);
            --text-main: #f8fafc;
            --primary: #10b981;
            --secondary: #3b82f6;
            --accent: #f59e0b;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: radial-gradient(circle at top, #1e293b, #0f172a); 
            color: var(--text-main); 
            margin: 0; 
            padding: 15px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .wrapper { 
            width: 100%;
            max-width: 420px; 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            padding: 20px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box; 
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 24px;
            letter-spacing: 1px;
            background: linear-gradient(to right, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .panel { 
            background: rgba(15, 23, 42, 0.6); 
            padding: 12px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; }
        .stat-value { font-size: 18px; font-weight: bold; }

        /* 🎒 FERTILIZER BAG DESIGN */
        .bag { 
            background: rgba(15, 23, 42, 0.4); 
            border: 1.5px solid var(--secondary); 
            border-radius: 18px; 
            padding: 12px; 
            margin-bottom: 20px; 
        }
        .bag-title { font-size: 12px; font-weight: bold; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; text-align: center; }
        .bag-grid { display: flex; gap: 12px; }
        .bag-card { 
            flex: 1; 
            background: rgba(30, 41, 59, 0.5); 
            border: 2px solid transparent; 
            border-radius: 14px; 
            padding: 10px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bag-card.active { 
            border-color: var(--secondary); 
            background: rgba(59, 130, 246, 0.15);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }
        .bag-card span { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
        .ad-btn { 
            background: #ef4444; 
            color: white; 
            border: none; 
            padding: 6px; 
            font-size: 11px; 
            font-weight: bold; 
            border-radius: 8px; 
            margin-top: 8px; 
            cursor: pointer; 
            width: 100%;
            box-shadow: 0 4px 6px rgba(239, 68, 68, 0.2);
            transition: background 0.2s;
        }
        .ad-btn:hover { background: #dc2626; }

        /* 🚜 FARM GRID DESIGN */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .plot { 
            background: #472f22; 
            height: 125px; 
            border-radius: 18px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border: 3px solid #2b1c14; 
            font-weight: bold; 
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5), 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        .plot:active { transform: scale(0.97); }
        .plot.growing { background: #5a3d2e; border-color: var(--accent); box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
        .plot.ready { 
            background: var(--primary); 
            border-color: #34d399; 
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
            animation: pulseGlow 2s infinite;
        }
        
        @keyframes pulseGlow {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* 🛒 SEED MARKET DESIGN */
        .market { 
            background: rgba(15, 23, 42, 0.4); 
            border: 1.5px solid var(--accent); 
            border-radius: 18px; 
            padding: 12px; 
            text-align: left; 
        }
        .market-title { font-size: 12px; font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; text-align: center; margin-bottom: 10px; }
        .market-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(30, 41, 59, 0.4); 
            padding: 10px 14px; 
            margin: 8px 0; 
            border-radius: 12px; 
            cursor: pointer; 
            border: 2px solid transparent; 
            transition: all 0.2s ease;
        }
        .market-row.active-seed { 
            border-color: var(--accent); 
            background: rgba(245, 158, 11, 0.12); 
        }
        .market-row:active { transform: translateX(2px); }
        .badge { background: var(--primary); color: white; padding: 4px 10px; border-radius: 8px; font-weight: bold; font-size: 13px; box-shadow: 0 2px 4px rgba(16,185,129,0.2); }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>🚜 Pi Farm Pro</h2>
    
    <!-- Balance & Seed Panel -->
    <div class="panel">
        <div class="stat-item">
            <span class="stat-label">Wallet Balance</span>
            <span class="stat-value" id="ui-balance" style="color: var(--accent);">15 🪙</span>
        </div>
        <div class="stat-item">

            <span class="stat-value" id="ui-seed" style="color: #cbd5e1;">🍅 TOMATO</span>
        </div>
    </div>

    <div class="bag">

                <button class="ad-btn" onclick="watchAd('normal', event)">📺 Ads (<span id="ui-prog-n">0/2</span>)</button>
            </div>
            <div class="bag-card" id="f-super" onclick="setFertilizer('super')">
                <span>🧪 Super</span>
                <div style="font-size: 12px; color: #94a3b8; margin-top:2px;">Stock: <b id="ui-stock-s" style="color:white">0</b></div>
                <button class="ad-btn" onclick="watchAd('super', event)">📺 Ads (<span id="ui-prog-s">0/4</span>)</button>
            </div>
        </div>
    </div>

    <!-- FARM GRID -->
    <div class="grid">
        <div class="plot" id="plot-0" onclick="clickPlot(0)">🟫<br><span id="text-0" style="margin-top: 5px; font-size: 13px; opacity: 0.7;">Empty Soil</span></div>
        <div class="plot" id="plot-1" onclick="clickPlot(1)">🟫<br><span id="text-1" style="margin-top: 5px; font-size: 13px; opacity: 0.7;">Empty Soil</span></div>
        <div class="plot" id="plot-2" onclick="clickPlot(2)">🟫<br><span id="text-2" style="margin-top: 5px; font-size: 13px; opacity: 0.7;">Empty Soil</span></div>
        <div class="plot" id="plot-3" onclick="clickPlot(3)">🟫<br><span id="text-3" style="margin-top: 5px; font-size: 13px; opacity: 0.7;">Empty Soil</span></div>
    </div>

    <!-- SEED MARKET -->
    <div class="market">
        <div class="market-title">🛒 Seed Market</div>
        <div class="market-row active-seed" id="s-tomato" onclick="setSeed('tomato', 3, '🍅', 8, 6)">
            <div><b>🍅 Tomato</b> <br><small style="color: #94a3b8;">Time: 8s | Reward: 6 🪙</small></div>
            <span class="badge">3 🪙</span>
        </div>
        <div class="market-row" id="s-pepper" onclick="setSeed('pepper', 7, '🫑', 18, 15)">
            <div><b>🫑 Pepper</b> <br><small style="color: #94a3b8;">Time: 18s | Reward: 15 🪙</small></div>
            <span class="badge">7 🪙</span>
        </div>
        <div class="market-row" id="s-berry" onclick="setSeed('berry', 15, '🍓', 40, 40)">
            <div><b>🍓 Golden Berry</b> <br><small style="color: #94a3b8;">Time: 40s | Reward: 40 🪙</small></div>
            <span class="badge">15 🪙</span>
        </div>
    </div>
</div>

<script>
