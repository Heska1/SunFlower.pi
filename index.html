<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pi Farm - Vercel Stable Edition</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --primary: #10b981;
            --secondary: #3b82f6;
            --accent: #f59e0b;
        }

        body { 
            font-family: Arial, sans-serif; 
            background: #0f172a; 
            color: var(--text-main); 
            margin: 0; 
            padding: 15px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }

        .wrapper { 
            width: 100%;
            max-width: 400px; 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
            box-sizing: border-box; 
        }

        h2 { margin: 0 0 15px 0; font-size: 24px; color: var(--accent); text-align: center; }

        .panel { 
            background: #0f172a; 
            padding: 12px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .stat-item { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        .stat-value { font-size: 17px; font-weight: bold; margin-top: 2px; }

        /* 🎒 FERTILIZER BAG */
        .bag { 
            background: rgba(0,0,0,0.2); 
            border: 2px solid var(--secondary); 
            border-radius: 14px; 
            padding: 12px; 
            margin-bottom: 15px; 
        }
        .bag-title { font-size: 12px; font-weight: bold; color: var(--secondary); text-transform: uppercase; margin-bottom: 8px; text-align: center; }
        .bag-grid { display: flex; gap: 10px; }
        
        .bag-card { 
            flex: 1; 
            background: #293548; 
            border: 3px solid transparent; 
            border-radius: 10px; 
            padding: 12px; 
            cursor: pointer;
            box-sizing: border-box;
            text-align: center;
        }
        .bag-card.active { 
            border-color: var(--secondary); 
            background: #1e3a8a;
        }
        .bag-card * { pointer-events: none; }

        /* 📺 AD ZONE */
        .ad-zone {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .ad-btn { 
            flex: 1;
            background: #ef4444; 
            color: white; 
            border: none; 
            padding: 10px; 
            font-size: 11px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            box-shadow: 0 4px 6px rgba(239, 68, 68, 0.2);
        }

        /* 🚜 FARM GRID */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .plot { 
            background: #472f22; 
            height: 110px; 
            border-radius: 14px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border: 3px solid #2b1c14; 
            font-weight: bold; 
            box-sizing: border-box;
        }
        .plot * { pointer-events: none; }
        .plot.growing { background: #5a3d2e; border-color: var(--accent); }
        .plot.ready { background: var(--primary); border-color: #34d399; }

        /* 🛒 SEED MARKET */
        .market { 
            background: rgba(0,0,0,0.2); 
            border: 2px solid var(--accent); 
            border-radius: 14px; 
            padding: 12px; 
            text-align: left; 
        }
        .market-title { font-size: 12px; font-weight: bold; color: var(--accent); text-transform: uppercase; text-align: center; margin-bottom: 8px; }
        
        .market-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #293548; 
            padding: 8px 12px; 
            margin: 6px 0; 
            border-radius: 8px; 
            cursor: pointer; 
            border: 3px solid transparent; 
            box-sizing: border-box;
        }
        .market-row * { pointer-events: none; }
        .market-row.active-seed { 
            border-color: var(--accent); 
            background: #1e293b; 
        }
        .badge { background: var(--primary); color: white; padding: 3px 8px; border-radius: 6px; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>🚜 Pi Farm Pro</h2>
    
    <div class="panel">
        <div class="stat-item">
            <span class="stat-label">Wallet Balance</span>
            <span class="stat-value" id="ui-balance" style="color: var(--accent);">15 🪙</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Selected Seed</span>
            <span class="stat-value" id="ui-seed" style="color: #cbd5e1;">🍅 TOMATO</span>
        </div>
    </div>

    <!-- 🎒 FERTILIZER BAG -->
    <div class="bag">
        <div class="bag-title">🎒 Select Active Fertilizer</div>
        <div class="bag-grid">
            <div class="bag-card active" id="f-normal">
                <span style="font-size:22px;">🫙</span><br>
                <span style="font-size:13px; font-weight:bold;">Normal</span><br>
                <span style="font-size:11px; color:#cbd5e1;">Stock: <b id="ui-stock-n">1</b></span>
            </div>
            <div class="bag-card" id="f-super">
                <span style="font-size:22px;">🧪</span><br>
                <span style="font-size:13px; font-weight:bold;">Super</span><br>
                <span style="font-size:11px; color:#cbd5e1;">Stock: <b id="ui-stock-s">0</b></span>
            </div>
        </div>
    </div>

    <!-- 📺 AD BUTTONS -->
    <div class="ad-zone">
        <button class="ad-btn" id="ad-normal-btn">Ad Normal (<span id="ui-prog-n">0/2</span>)</button>
        <button class="ad-btn" id="ad-super-btn">Ad Super (<span id="ui-prog-s">0/4</span>)</button>
    </div>

    <!-- FARM GRID -->
    <div class="grid">
        <div class="plot" id="plot-0">🟫<br><span id="text-0">Empty Soil</span></div>
        <div class="plot" id="plot-1">🟫<br><span id="text-1">Empty Soil</span></div>
        <div class="plot" id="plot-2">🟫<br><span id="text-2">Empty Soil</span></div>
        <div class="plot" id="plot-3">🟫<br><span id="text-3">Empty Soil</span></div>
    </div>

    <!-- SEED MARKET -->
    <div class="market">
        <div class="market-title">🛒 Seed Market</div>
        <div class="market-row active-seed" id="s-tomato">
            <div><b>🍅 Tomato</b> <br><small style="color: #94a3b8;">Time: 8s | Sell: 6 🪙</small></div>
            <span class="badge">3 🪙</span>
        </div>
        <div class="market-row" id="s-pepper">
            <div><b>🫑 Pepper</b> <br><small style="color: #94a3b8;">Time: 18s | Sell: 15 🪙</small></div>
            <span class="badge">7 🪙</span>
        </div>
        <div class="market-row" id="s-berry">
            <div><b>🍓 Golden Berry</b> <br><small style="color: #94a3b8;">Time: 40s | Sell: 40 🪙</small></div>
            <span class="badge">15 🪙</span>
        </div>
    </div>
</div>

<script>
    // Game Data
    let balance = 15;
    let fertNormal = 1, fertSuper = 0;
    let selectedFert = 'normal';
    let adProgN = 0, adProgS = 0;

    let activeSeed = 'tomato';
    let seedCost = 3;
    let seedEmoji = '🍅';
    let seedTime = 8;
    let seedSell = 6;

    let plots = [
        { status: 'empty', emoji: '', time: 0, sell: 0, timer: null },
        { status: 'empty', emoji: '', time: 0, sell: 0, timer: null },
        { status: 'empty', emoji: '', time: 0, sell: 0, timer: null },
        { status: 'empty', emoji: '', time: 0, sell: 0, timer: null }
    ];

    // 🔒 Event Listener Binding (En Güvenli Mobil Tıklama Mimarisi)
    document.addEventListener("DOMContentLoaded", () => {
        
        // Seed Market Clicks
        document.getElementById('s-tomato').addEventListener('click', () => setSeed('tomato', 3, '🍅', 8, 6));
        document.getElementById('s-pepper').addEventListener('click', () => setSeed('pepper', 7, '🫑', 18, 15));
        document.getElementById('s-berry').addEventListener('click', () => setSeed('berry', 15, '🍓', 40, 40));

        // Fertilizer Bag Clicks
        document.getElementById('f-normal').addEventListener('click', () => setFertilizer('normal'));
        document.getElementById('f-super').addEventListener('click', () => setFertilizer('super'));

        // Ad Button Clicks
        document.getElementById('ad-normal-btn').addEventListener('click', () => watchAd('normal'));
        document.getElementById('ad-super-btn').addEventListener('click', () => watchAd('super'));

        // Farm Plot Clicks
        for (let i = 0; i < 4; i++) {
            document.getElementById('plot-' + i).addEventListener('click', () => clickPlot(i));
        }

        render();
    });

    function setSeed(type, cost, emoji, time, sell) {
        activeSeed = type;
        seedCost = cost;
        seedEmoji = emoji;
        seedTime = time;
        seedSell = sell;
        document.querySelectorAll('.market-row').forEach(r => r.classList.remove('active-seed'));
        document.getElementById('s-' + type).classList.add('active-seed');
        document.getElementById('ui-seed').innerText = emoji + " " + type.toUpperCase();
    }

    function setFertilizer(type) {
