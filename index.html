<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Farm Butonsuz Sürüm</title>
    <style>
        body { font-family: sans-serif; background: #111; color: white; text-align: center; padding: 20px; }
        .box { max-width: 360px; margin: auto; background: #222; padding: 20px; border-radius: 15px; border: 2px solid #333; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        
        /* Büyük Tarla Kutuları */
        .plot { background: #5c4033; height: 120px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 3px solid #3d2a1f; font-size: 16px; font-weight: bold; }
        .plot.ready { background: #27ae60; border-color: #2ecc71; }
        
        /* Büyük Dev Dokunma Alanları */
        .big-zone { background: #2c3e50; border: 2px solid #3498db; padding: 15px; border-radius: 10px; margin: 15px 0; cursor: pointer; font-weight: bold; }
        .ad-zone { background: #c0392b; border-color: #e74c3c; color: white; }
    </style>
</head>
<body>

<div class="box">
    <h2>🌾 Butonsuz Pi Çiftliği</h2>
    <p>Cüzdan Puanı: <b id="balance" style="color:#f1c40f; font-size: 20px;">15</b> 🪙</p>
    <p>Süper Gübre Stoğu: <b id="fert-count" style="color:#3498db;">1</b> 🧪</p>
    <p style="background:#333; padding:5px; border-radius:5px; font-size:13px;">Seçili Tohum: <span id="seed-name" style="color:#f1c40f; font-weight:bold;">🍅 Domates (3 🪙)</span></p>

    <!-- TARLALAR -->
    <div class="grid">
        <div class="plot" id="plot-0" onclick="interactPlot(0)">🟫<br><span id="text-0">Boş Toprak</span></div>
        <div class="plot" id="plot-1" onclick="interactPlot(1)">🟫<br><span id="text-1">Boş Toprak</span></div>
        <div class="plot" id="plot-2" onclick="interactPlot(2)">🟫<br><span id="text-2">Boş Toprak</span></div>
        <div class="plot" id="plot-3" onclick="interactPlot(3)">🟫<br><span id="text-3">Boş Toprak</span></div>
    </div>

    <!-- 🛒 TOHUM DEĞİŞTİRME ALANI (BÜYÜK PANEL - TIKLAYINCA SIRAYLA DEĞİŞİR) -->
    <div class="big-zone" onclick="nextSeed()">
        🔄 TOHUM DEĞİŞTİRMEK İÇİN BURAYA TIKLA
    </div>

    <!-- 📺 REKLAM ALANI (BÜYÜK PANEL - TIKLAYINCA DOĞRUDAN REKLAM VERİR) -->
    <div class="big-zone ad-zone" onclick="getFertilizer()">
        📺 GÜBRE ALMAK İÇİN BURAYA TIKLA (REKLAM)
    </div>
</div>

<script>
    let balance = 15;
    let fertilizer = 1;
    
    // Tohum Listesi Döngüsü
    let seedIndex = 0;
    const seeds = [
        { id: 'tomato', name: 'Domates', cost: 3, time: 6, emoji: '🍅' },
        { id: 'pepper', name: 'Biber', cost: 7, time: 15, emoji: '🫑' },
        { id: 'berry', name: 'Altın Çilek', cost: 15, time: 40, emoji: '🍓' }
    ];

    let plots = [{status:'empty', plant:null, timeLeft:0, interval:null},{status:'empty', plant:null, timeLeft:0, interval:null},{status:'empty', plant:null, timeLeft:0, interval:null},{status:'empty', plant:null, timeLeft:0, interval:null}];

    // Tohum değiştirme fonksiyonu (Sırayla döner)
    function nextSeed() {
        seedIndex = (seedIndex + 1) % seeds.length;
        document.getElementById('seed-name').innerText = seeds[seedIndex].emoji + " " + seeds[seedIndex].name + " (" + seeds[seedIndex].cost + " 🪙)";
    }

    // Reklam izleme fonksiyonu
    function getFertilizer() {
        alert("Reklam başarıyla izlendi!");
        fertilizer++;
        document.getElementById('fert-count').innerText = fertilizer;
    }

    function interactPlot(index) {
        let plot = plots[index];
        let plotEl = document.getElementById('plot-' + index);
        let textEl = document.getElementById('text-' + index);
        let currentSeed = seeds[seedIndex];

        if (plot.status === 'empty') {
            if (balance >= currentSeed.cost) {
                balance -= currentSeed.cost;
                document.getElementById('balance').innerText = balance;

                plot.status = 'growing';
                plot.plant = currentSeed;
                plot.timeLeft = currentSeed.time;
                plotEl.innerHTML = "🌱<br><span id='text-"+index+"'>" + plot.timeLeft + "s</span>";

                plot.interval = setInterval(() => {
                    plot.timeLeft--;
                    let textNode = document.getElementById('text-' + index);
                    if(textNode) textNode.innerText = plot.timeLeft + "s";

                    if (plot.timeLeft <= 0) {
                        clearInterval(plot.interval);
                        plot.status = 'ready';
                        plotEl.classList.add('ready');
                        plotEl.innerHTML = plot.plant.emoji + "<br><b>HASAT ET</b>";
                    }
                }, 1000);
            } else { alert("Yetersiz bakiye!"); }
        } 
        else if (plot.status === 'growing' && fertilizer > 0) {
            fertilizer--;
            document.getElementById('fert-count').innerText = fertilizer;
            clearInterval(plot.interval);
            plot.status = 'ready';
            plotEl.classList.add('ready');
            plotEl.innerHTML = plot.plant.emoji + "<br><b>HASAT ET</b>";
        }
        else if (plot.status === 'ready') {
            balance += plot.plant.sell || (plot.plant.cost * 2); // Kâr marjı
            document.getElementById('balance').innerText = balance;
            plot.status = 'empty';
            plot.plant = null;
            plotEl.classList.remove('ready');
            plotEl.innerHTML = "🟫<br><span>Boş Toprak</span>";
        }
    }
</script>
</body>
</html>
